dialog.about.title=О программе
dialog.about.text=IceJA Writer v%s\n\nПрограмма для написания романов: описание, «Библия романа»,\nкарточки сцен и тексты — в одном файле проекта .ijw.\n\nЛицензия MIT: программа распространяется бесплатно, разрешены\nиспользование, изменение и распространение, в том числе коммерческое.\n\nВнимание: текст, полностью сгенерированный AI, может не охраняться\nавторским правом; издательства могут требовать раскрытия\nиспользования AI при создании произведения.

